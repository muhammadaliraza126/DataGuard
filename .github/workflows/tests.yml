name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: dataguard --version
      - run: dataguard examples/current.csv --contract examples/contract.json --baseline examples/baseline.csv --output-dir reports/installed
      - run: python scripts/build_demo.py
      - run: git diff --exit-code -- docs/index.html docs/clean-report.json docs/invalid-report.json
      - run: python dataguard.py examples/current.csv --contract examples/contract.json --baseline examples/baseline.csv --output-dir reports/demo
